{% extends 'base.html' %}
{% load custom_filters %}
{% block content %}

<style>
/* HEART ANIMATION */
@keyframes heartBeat {
    0%   { transform: scale(1); }
    25%  { transform: scale(1.5); }
    50%  { transform: scale(1.2); }
    75%  { transform: scale(1.4); }
    100% { transform: scale(1); }
}
@keyframes heartBreak {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    30%  { transform: scale(1.3) rotate(-15deg); opacity: 0.8; }
    60%  { transform: scale(0.8) rotate(15deg); opacity: 0.5; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.heart-btn {
    background: none; border: none; cursor: pointer;
    font-size: 26px; line-height: 1; padding: 0;
    transition: color 0.2s;
    display: inline-block;
}
.heart-btn.beating { animation: heartBeat 0.5s ease; }
.heart-btn.breaking { animation: heartBreak 0.4s ease; }

/* TOAST */
.wish-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 12px 24px;
    border-radius: 30px; font-size: 14px; font-weight: 600;
    z-index: 99999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
}
.wish-toast.show { opacity: 1; }
.wish-toast.success { background: #1a9e3f; }
.wish-toast.remove  { background: #e60023; }

.product-card { transition: 0.25s; border-radius: 12px !important; }
.product-card:hover { transform: translateY(-5px); box-shadow: 0 16px 36px rgba(0,0,0,0.13) !important; }
</style>

<div class="container mt-4 mb-5">
    <h5 class="fw-bold mb-4"><i class="fa-solid fa-heart text-danger me-2"></i>Sản phẩm yêu thích</h5>
    <div id="wishlistGrid" class="row g-4"></div>
    <div id="wishlistEmpty" class="text-center py-5" style="display:none;">
        <i class="fa-solid fa-heart fa-3x text-muted mb-3"></i>
        <p class="text-muted">Bạn chưa có sản phẩm yêu thích nào.</p>
        <a href="{% url 'home' %}" class="btn btn-outline-dark rounded-pill px-4">Khám phá ngay</a>
    </div>
</div>

<!-- Toast notification -->
<div class="wish-toast" id="wishToast"></div>

<script>
// ===== WISHLIST PAGE - hoàn toàn dùng localStorage + AJAX lấy data =====

function showToast(msg, type) {
    const t = document.getElementById('wishToast');
    t.textContent = msg;
    t.className = 'wish-toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 2500);
}

function saveToHistory(id, name, image, price, url) {
    let history = JSON.parse(localStorage.getItem('rv_history') || '[]');
    history = history.filter(p => p.id !== id);
    history.unshift({ id, name, image, price, url });
    if (history.length > 10) history = history.slice(0, 10);
    localStorage.setItem('rv_history', JSON.stringify(history));
}

function removeFromWishlistPage(watchId, btn) {
    // Hiệu ứng tim vỡ
    btn.classList.remove('beating');
    void btn.offsetWidth;
    btn.classList.add('breaking');
    btn.textContent = '🖤';
    setTimeout(() => {
        // Xóa khỏi localStorage
        let wishlist = JSON.parse(localStorage.getItem('wishlist_ids') || '[]');
        wishlist = wishlist.filter(id => id !== watchId);
        localStorage.setItem('wishlist_ids', JSON.stringify(wishlist));
        // Xóa card khỏi DOM
        const col = btn.closest('.wish-col');
        if (col) col.remove();
        showToast('💔 Đã xóa khỏi yêu thích!', 'remove');
        if (document.querySelectorAll('.wish-col').length === 0) {
            document.getElementById('wishlistGrid').style.display = 'none';
            document.getElementById('wishlistEmpty').style.display = 'block';
        }
    }, 400);
}

async function loadWishlist() {
    const ids = JSON.parse(localStorage.getItem('wishlist_ids') || '[]');
    const grid = document.getElementById('wishlistGrid');
    const empty = document.getElementById('wishlistEmpty');

    if (!ids.length) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
    }

    // Lấy thông tin sản phẩm qua AJAX
    try {
        const res = await fetch('/search/ajax/?q=&ids=' + ids.join(','));
        const data = await res.json();

        if (!data.results || !data.results.length) {
            // Fallback: dùng cache từ localStorage nếu có
            grid.style.display = 'none';
            empty.style.display = 'block';
            return;
        }

        grid.innerHTML = data.results.map(p => `
            <div class="col-6 col-md-3 wish-col">
                <div class="card product-card border-0 shadow-sm p-3 position-relative h-100 d-flex flex-column"
                     onclick="saveToHistory('${p.id}', '${p.name.replace(/'/g,"\\'")}', '${p.image}', '${p.price}', '${p.url}'); window.location.href='${p.url}';"
                     style="cursor:pointer;">
                    <button class="heart-btn beating" style="position:absolute;top:8px;right:8px;color:#e60023;z-index:5;"
                        onclick="event.stopPropagation(); removeFromWishlistPage(${p.id}, this)">❤️</button>
                    <img src="${p.image}" class="img-fluid mb-3" style="height:170px;object-fit:contain;">
                    <h6 class="fw-bold text-center" style="font-size:13px;">${p.name}</h6>
                    <p class="text-danger fw-bold text-center mb-0">${p.price}</p>
                    <a href="${p.url}" class="btn btn-outline-dark rounded-pill btn-sm mt-auto"
                       onclick="event.stopPropagation()">Chi tiết</a>
                </div>
            </div>
        `).join('');
        grid.style.display = '';
        empty.style.display = 'none';
    } catch(e) {
        grid.style.display = 'none';
        empty.style.display = 'block';
    }
}

loadWishlist();
</script>
{% endblock %}
