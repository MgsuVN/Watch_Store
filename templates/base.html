<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WATCHSTORE.VN - Đồng Hồ Chính Hãng{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <style>
        /* ===== BASE RESET ===== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            overflow-x: hidden; /* Tránh scroll ngang trên mobile */
        }

        .main-content {
            min-height: 600px;
        }

        /* ===== DROPDOWN RESPONSIVE (dùng chung) ===== */
        /* Desktop: dropdown thả xuống bình thường */
        @media (min-width: 992px) {
            .dropdown-menu-end {
                right: 0;
                left: auto;
            }
        }

        /* Tablet & Mobile: dropdown căn giữa, dễ bấm */
        @media (max-width: 991.98px) {
            /* Dropdown item dễ bấm hơn */
            .dropdown-item {
                padding: 12px 20px !important;
                font-size: 15px;
            }
        }

        /* Icon trong dropdown thẳng hàng */
        .dropdown-item i {
            width: 1.5rem;
            text-align: center;
            display: inline-block;
        }
        .dropdown-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }

        /* ===== UTILITY: Tránh ảnh tràn khung ===== */
        img {
            max-width: 100%;
            height: auto;
        }

        /* ===== CONTAINER padding nhỏ hơn trên mobile ===== */
        @media (max-width: 575.98px) {
            .container, .container-fluid {
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% include 'includes/header.html' %}

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    {% include 'includes/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

    {% block extra_js %}{% endblock %}

    {% include 'includes/chatbot_widget.html' %}
</body>
</html>
